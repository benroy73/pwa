<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>⚡ Power Outage Check</title>

  <!-- iOS PWA Meta Tags -->
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="⚡ Outage Check" />
  <meta name="theme-color" content="#0f172a" />

  <!-- Inline Web Manifest for PWA Support -->
  <link rel="manifest" href='data:application/manifest+json,{"name":"⚡ Power Outage Check","short_name":"⚡ Outages","start_url":".","display":"standalone","background_color":"%230f172a","theme_color":"%230f172a"}' />

  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --accent-green: #22c55e;
      --accent-red: #ef4444;
      --accent-blue: #38bdf8;
      --accent-amber: #f59e0b;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      padding: env(safe-area-inset-top) 16px env(safe-area-inset-bottom) 16px;
    }

    header {
      padding: 24px 0 12px 0;
      text-align: center;
    }

    header h1 {
      font-size: 1.5rem;
      font-weight: 700;
    }

    header p {
      font-size: 0.875rem;
      color: var(--text-muted);
      margin-top: 4px;
    }

    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 16px;
      max-width: 500px;
      width: 100%;
      margin: 0 auto;
    }

    .card {
      background-color: var(--card-bg);
      border-radius: 16px;
      padding: 20px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.3);
    }

    .status-badge {
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 1.1rem;
      font-weight: 600;
    }

    .status-icon {
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background-color: var(--text-muted);
    }

    .status-icon.clear { background-color: var(--accent-green); box-shadow: 0 0 10px var(--accent-green); }
    .status-icon.outage { background-color: var(--accent-red); box-shadow: 0 0 10px var(--accent-red); }
    .status-icon.warn { background-color: var(--accent-amber); box-shadow: 0 0 10px var(--accent-amber); }

    .warn-box {
      display: none;
      margin-top: 10px;
      padding: 10px 12px;
      border-left: 4px solid var(--accent-amber);
      background: rgba(245, 158, 11, 0.08);
      border-radius: 8px;
      font-size: 0.8rem;
      line-height: 1.4;
      color: var(--text-muted);
    }

    .coords-info {
      font-size: 0.8rem;
      color: var(--text-muted);
      margin-top: 8px;
    }

    .btn {
      background-color: var(--accent-blue);
      color: #0f172a;
      border: none;
      border-radius: 12px;
      padding: 14px;
      font-size: 1rem;
      font-weight: 600;
      width: 100%;
      cursor: pointer;
      transition: opacity 0.2s;
      margin-top: 12px;
    }

    .btn:active {
      opacity: 0.8;
    }

    .toggle-link {
      display: inline-block;
      font-size: 0.8rem;
      color: var(--accent-blue);
      text-decoration: underline;
      margin-top: 10px;
      cursor: pointer;
    }

    .manual-inputs {
      display: flex;
      gap: 8px;
      margin-top: 12px;
    }

    .manual-inputs input {
      flex: 1;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 8px;
      padding: 10px;
      color: var(--text-main);
      font-size: 0.9rem;
    }

    .outage-item {
      border-left: 4px solid var(--accent-red);
      padding-left: 12px;
      margin-top: 12px;
    }

    .outage-item h4 {
      color: var(--accent-red);
      font-size: 1rem;
      margin-bottom: 4px;
    }

    .outage-detail {
      font-size: 0.875rem;
      color: var(--text-muted);
      line-height: 1.5;
    }

    .outage-detail strong {
      color: var(--text-main);
    }

    .utility-links {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .utility-link {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background-color: rgba(255, 255, 255, 0.05);
      padding: 12px 16px;
      border-radius: 12px;
      color: var(--accent-blue);
      text-decoration: none;
      font-size: 0.9rem;
      font-weight: 500;
    }

    .utility-link:active {
      background-color: rgba(255, 255, 255, 0.1);
    }

    .spinner {
      border: 3px solid rgba(255, 255, 255, 0.1);
      border-left-color: var(--accent-blue);
      border-radius: 50%;
      width: 18px;
      height: 18px;
      animation: spin 1s linear infinite;
      display: inline-block;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>

  <header>
    <h1>⚡ Power Outage Check</h1>
    <p>Seattle City Light</p>
  </header>

  <main>
    <div class="card">
      <div class="status-badge">
        <span id="statusIcon" class="status-icon"></span>
        <span id="statusText">Ready to check location</span>
      </div>
      <div id="coordsDisplay" class="coords-info">Tap below to scan current position</div>
      <div id="warnBox" class="warn-box"></div>
      
      <button id="checkBtn" class="btn" onclick="getLocationAndCheck()">Check My Location</button>

      <div style="text-align: center;">
        <span class="toggle-link" onclick="toggleManualEntry()">Enter location manually instead</span>
      </div>

      <div id="manualEntryBox" style="display: none;">
        <div class="manual-inputs">
          <input type="number" id="manualLat" step="any" placeholder="Latitude (e.g. 47.50332)">
          <input type="number" id="manualLon" step="any" placeholder="Longitude (e.g. -122.16199)">
        </div>
        <button class="btn" style="background-color: #334155; color: #f8fafc;" onclick="checkManualCoordinates()">Check Entered Coordinates</button>
      </div>
    </div>

    <div id="resultsCard" class="card" style="display: none;">
      <h3 style="margin-bottom: 12px; font-size: 1.1rem;">Active Outage Details</h3>
      <div id="resultsContainer"></div>
    </div>

    <div class="card">
      <h3 style="margin-bottom: 12px; font-size: 1.1rem;">Outage Resources</h3>
      <div class="utility-links">
        <a class="utility-link" href="https://www.seattle.gov/city-light/outages" target="_blank" rel="noopener">
          <span>Seattle City Light (SCL)</span>
          <span>Report &rarr;</span>
        </a>
        <a class="utility-link" href="https://www.google.com/search?q=what+power+outages+are+near+me" target="_blank" rel="noopener">
          <span>Outside the SCL area? Outages near me</span>
          <span>Search &rarr;</span>
        </a>
      </div>
    </div>
  </main>

  <script>
    const SCL_URL = "https://utilisocial.io/datacapable/v2/p/scl/map/events";
    const FETCH_TIMEOUT_MS = 15000;

    function escapeHtml(value) {
      return String(value ?? "").replace(/[&<>"']/g, c => (
        { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]
      ));
    }

    async function fetchJson(url) {
      const ctrl = new AbortController();
      const timer = setTimeout(() => ctrl.abort(), FETCH_TIMEOUT_MS);
      try {
        const res = await fetch(url, { signal: ctrl.signal });
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const text = await res.text();
        try {
          return JSON.parse(text);
        } catch (e) {
          throw new Error("response was not JSON");
        }
      } finally {
        clearTimeout(timer);
      }
    }

    function toggleManualEntry() {
      const box = document.getElementById("manualEntryBox");
      box.style.display = box.style.display === "none" ? "block" : "none";
    }

    function latlonToWebMercator(lat, lon) {
      const x = (lon * 20037508.34) / 180.0;
      let y = Math.log(Math.tan(((90.0 + lat) * Math.PI) / 360.0)) / (Math.PI / 180.0);
      y = (y * 20037508.34) / 180.0;
      return [x, y];
    }

    function ringContains(ring, x, y) {
      let inside = false;
      for (let i = 0, j = ring.length - 1; i < ring.length; j = i++) {
        const xi = ring[i][0], yi = ring[i][1];
        const xj = ring[j][0], yj = ring[j][1];
        const intersect = ((yi > y) !== (yj > y)) && (x < ((xj - xi) * (y - yi)) / (yj - yi) + xi);
        if (intersect) inside = !inside;
      }
      return inside;
    }

    function formatEpochMs(ms) {
      if (!ms) return "TBD";
      try {
        const d = new Date(Number(ms));
        return d.toLocaleString([], { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' });
      } catch (e) {
        return "TBD";
      }
    }

    // Resolves to { matches, error }. A failed feed must never look like
    // "no outage", so the error is carried through to the UI.
    async function checkSCL(lat, lon) {
      try {
        const data = await fetchJson(SCL_URL);
        if (!Array.isArray(data)) throw new Error("unexpected response format");

        const [targetX, targetY] = latlonToWebMercator(lat, lon);
        const matches = [];

        for (const item of data) {
          const rings = [];
          const rawRings = item.polygons?.rings || [];
          for (const r of rawRings) {
            if (Array.isArray(r) && r.length >= 3) rings.push(r);
          }

          let isInside = false;
          if (rings.length > 0) {
            isInside = rings.some(r => ringContains(r, targetX, targetY) || ringContains(r, lon, lat));
          }

          if (!isInside && item.latitude && item.longitude) {
            const dist = Math.hypot(lat - item.latitude, lon - item.longitude);
            if (dist <= 0.003) isInside = true;
          }

          if (isInside) {
            matches.push({
              provider: "Seattle City Light",
              id: item.identifier || item.id || "N/A",
              status: item.status || "Active",
              cause: item.cause || "Under Investigation",
              customers: item.numPeople ?? "N/A",
              ert: formatEpochMs(item.etrTime)
            });
          }
        }
        return { matches, error: null };
      } catch (e) {
        console.error("SCL fetch failed:", e);
        return { matches: [], error: e.name === "AbortError" ? "timed out" : e.message };
      }
    }

    async function executeCheck(lat, lon) {
      const statusIcon = document.getElementById("statusIcon");
      const statusText = document.getElementById("statusText");
      const coordsDisplay = document.getElementById("coordsDisplay");
      const warnBox = document.getElementById("warnBox");
      const resultsCard = document.getElementById("resultsCard");
      const resultsContainer = document.getElementById("resultsContainer");

      statusIcon.className = "status-icon";
      statusText.innerHTML = '<span class="spinner"></span> Querying Seattle City Light...';
      coordsDisplay.innerText = `Testing: ${lat.toFixed(5)}, ${lon.toFixed(5)}`;
      warnBox.style.display = "none";

      const scl = await checkSCL(lat, lon);

      if (scl.error) {
        warnBox.innerHTML = `<strong>SCL</strong> could not be checked: ${escapeHtml(scl.error)}`;
        warnBox.style.display = "block";
      }

      if (scl.matches.length > 0) {
        statusIcon.className = "status-icon outage";
        statusText.innerText = `Outage Detected (${scl.matches.length})`;

        resultsContainer.innerHTML = scl.matches.map(o => `
          <div class="outage-item">
            <h4>${escapeHtml(o.provider)} (ID: ${escapeHtml(o.id)})</h4>
            <div class="outage-detail">
              <strong>Status:</strong> ${escapeHtml(o.status)}<br/>
              <strong>Est. Restoration (ETR):</strong> ${escapeHtml(o.ert)}<br/>
              <strong>Customers Affected:</strong> ${escapeHtml(o.customers)}<br/>
              <strong>Cause:</strong> ${escapeHtml(o.cause)}
            </div>
          </div>
        `).join("");

        resultsCard.style.display = "block";
      } else if (scl.error) {
        statusIcon.className = "status-icon warn";
        statusText.innerText = "Couldn't check Seattle City Light";
        resultsCard.style.display = "none";
      } else {
        statusIcon.className = "status-icon clear";
        statusText.innerText = "No Active SCL Outage Found";
        resultsCard.style.display = "none";
      }
    }

    function checkManualCoordinates() {
      const latVal = parseFloat(document.getElementById("manualLat").value);
      const lonVal = parseFloat(document.getElementById("manualLon").value);

      if (isNaN(latVal) || isNaN(lonVal)) {
        alert("Please enter valid numerical latitude and longitude coordinates.");
        return;
      }

      executeCheck(latVal, lonVal);
    }

    function getLocationAndCheck() {
      const statusIcon = document.getElementById("statusIcon");
      const statusText = document.getElementById("statusText");
      const coordsDisplay = document.getElementById("coordsDisplay");

      if (!navigator.geolocation) {
        statusText.innerText = "Geolocation not supported";
        return;
      }

      statusIcon.className = "status-icon";
      statusText.innerHTML = '<span class="spinner"></span> Requesting Location...';

      navigator.geolocation.getCurrentPosition(
        (pos) => {
          executeCheck(pos.coords.latitude, pos.coords.longitude);
        },
        (err) => {
          statusIcon.className = "status-icon";
          statusText.innerText = "Location access denied";
          coordsDisplay.innerText = "Use manual coordinate entry below instead.";
        },
        { enableHighAccuracy: true, timeout: 10000 }
      );
    }
  </script>
</body>
</html>
